        body {
            font-family: 'Noto Sans TC', 'Fredoka One', sans-serif;
            background-color: #0b1329;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;

        /* Pokédex Outer Bezel & Inner Glass Aesthetics */
        .pokedex-case {
            background: linear-gradient(160deg, #dc2626 0%, #b91c1c 70%, #991b1b 100%);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 3px 6px rgba(255, 255, 255, 0.35);

        .pokedex-screen {

            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.2);
            border: 3px solid #334155;
        }

        /* Float & Shake Animations */
        @keyframes float-bounce {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.03); }
        }

        .animate-float {
            animation: float-bounce 2.2s ease-in-out infinite;
        }

        @keyframes shake-err {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .animate-shake {
            animation: shake-err 0.4s ease-in-out;
        }

        /* Precise Pinyin Ruby Typography Alignment */
        ruby {
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            vertical-align: middle;
            margin: 0 1.5px;
            line-height: 1;
        }

        rt {
            font-size: 0.58em;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 2px;
            letter-spacing: -0.02em;
            text-transform: lowercase;
            user-select: none;
            opacity: 0.9;

        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 20px;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 10px solid #ffffff;

        ::-webkit-scrollbar {
            width: 5px;

    <script>
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            if (!soundEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            const soundIcon = document.getElementById('soundIcon');
            if (soundIcon) {
                soundIcon.className = soundEnabled ? 'fas fa-volume-up text-xs' : 'fas fa-volume-mute text-xs';
            }
        }

        // Web Speech API for Standard Mandarin Pronunciation (ensuring full 4th tone "sè" for "色")
        function speakText(text) {
            if (!soundEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Using zh-TW voice profile to preserve standard 4th tone (sè) for color suffix
                utterance.lang = 'zh-TW'; 
                utterance.rate = 0.8;     // Moderate pace for clear young learner comprehension
                utterance.pitch = 1.0;    // Standard pitch contour

                const voices = window.speechSynthesis.getVoices();
                const preferredVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh_TW')) ||
                                       voices.find(v => v.lang.startsWith('zh'));
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Web Audio Synthesizer for feedback chimes
        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(750, now + 0.05);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'correct') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const startTime = now + idx * 0.07;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.18);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.18);
                });
            } else if (type === 'wrong') {
                const freqs = [220, 180];
                freqs.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const startTime = now + idx * 0.12;
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.18, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.14);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.14);
                });
            } else if (type === 'gameover') {
                const notes = [440, 392, 349.23, 293.66];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const startTime = now + idx * 0.14;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.22);
                });
            }
        }

            // 1. 紅色 (Red)

                options: [
                    { name: "紅色", ruby: "<ruby>紅<rt>hóng</rt></ruby><ruby>色<rt>sè</rt></ruby>", hex: "#ef4444", icon: "fa-apple-whole" },

            // 2. 黃色 (Yellow)
            {
                pokemon: "皮卡丘",
                pokemonRuby: "<ruby>皮<rt>pí</rt></ruby><ruby>卡<rt>kǎ</rt></ruby><ruby>丘<rt>qiū</rt></ruby>",
                pokemonSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="55" r="35" fill="#facc15"/><path d="M25,25 L35,45 L15,35 Z" fill="#facc15" stroke="#000" stroke-width="2"/><path d="M75,25 L65,45 L85,35 Z" fill="#facc15" stroke="#000" stroke-width="2"/><circle cx="40" cy="50" r="4" fill="#000"/><circle cx="60" cy="50" r="4" fill="#000"/><circle cx="30" cy="65" r="6" fill="#ef4444"/><circle cx="70" cy="65" r="6" fill="#ef4444"/></svg>`,
                targetColorName: "黃色",

        let currentQuestionIndex = 0;
        let score = 0;
        let lives = 3;
        let questions = [];

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startGame() {
            playSound('click');
            score = 0;
            lives = 3;
            currentQuestionIndex = 0;
            questions = shuffleArray(rawQuestionBank);

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('feedbackModal').classList.add('hidden');
            document.getElementById('questionScreen').classList.remove('hidden');

            updateHUD();
            renderQuestion();
        }

        function updateHUD() {
            document.getElementById('scoreText').innerText = score;
            document.getElementById('currentLevelText').innerText = Math.min(currentQuestionIndex + 1, questions.length);

            const livesContainer = document.getElementById('livesContainer');
            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('i');
                if (i < lives) {
                    heart.className = 'fas fa-heart text-red-500 text-base sm:text-lg drop-shadow-sm transition-transform transform scale-100';
                } else {
                    heart.className = 'far fa-heart text-slate-400 text-base sm:text-lg opacity-50';
                }
                livesContainer.appendChild(heart);
            }
        }

        function renderQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showGameOver(true);
                return;
            }

            const q = questions[currentQuestionIndex];

            // Render Pokemon Avatar and Speech Header
            document.getElementById('pokemonAvatar').innerHTML = q.pokemonSvg;
            document.getElementById('pokemonName').innerHTML = `${q.pokemonRuby} 說：`;

            // Prompt text with matching colored badge and Pinyin
            const coloredBadge = `<span class="px-2 py-0.5 rounded-lg border font-black text-xs sm:text-sm inline-flex items-center align-middle mx-1 shadow-sm" style="color: ${q.targetHex === '#ffffff' ? '#0f172a' : q.targetHex}; background-color: ${q.targetHex === '#ffffff' ? '#ffffff' : q.targetHex + '18'}; border-color: ${q.targetHex === '#ffffff' ? '#94a3b8' : q.targetHex};">${q.targetRuby}</span>`;
            const formattedPrompt = q.promptText.replace(`【${q.targetColorName}】`, coloredBadge);
            document.getElementById('questionPrompt').innerHTML = formattedPrompt;

            // Target Visual Display Box
            const targetBox = document.getElementById('targetDisplayBox');
            targetBox.style.borderColor = q.targetHex === '#ffffff' ? '#cbd5e1' : q.targetHex;

            document.getElementById('targetVisual').innerHTML = `
                ${q.targetSvg}
                <div class="mt-1.5 px-3 py-1 rounded-full border shadow-sm flex items-center space-x-1 bg-white" style="border-color: ${q.targetHex === '#ffffff' ? '#cbd5e1' : q.targetHex};">
                    <span class="w-3 h-3 rounded-full border border-slate-300 inline-block" style="background-color: ${q.targetHex};"></span>
                    <span class="text-xs font-black text-slate-700 flex items-center">目標：${q.targetRuby}</span>
                </div>
            `;

            // Choices Grid (Shuffled 4 Buttons)
            const shuffledOptions = shuffleArray(q.options);
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';

            shuffledOptions.forEach(opt => {
                const isCorrect = (opt.name === q.targetColorName);
                const btn = document.createElement('button');

                const isLight = (opt.hex === '#eab308' || opt.hex === '#ffffff');
                const textColor = isLight ? 'text-slate-900' : 'text-white';
                const borderColor = isLight ? 'border-amber-400' : 'border-black/25';

                btn.className = `w-full h-20 rounded-2xl border-b-4 ${borderColor} flex flex-col items-center justify-center p-2 transition active:scale-95 shadow relative overflow-hidden`;
                btn.style.backgroundColor = opt.hex;

                if (opt.hex === '#ffffff') {
                    btn.style.border = "3px solid #cbd5e1";
                    btn.style.borderBottomWidth = "5px";
                }

                btn.innerHTML = `
                    <div class="w-7 h-7 rounded-full bg-white/90 shadow-inner flex items-center justify-center mb-1 border border-slate-200">
                        <i class="fas ${opt.icon} text-sm" style="color: ${opt.hex === '#ffffff' ? '#64748b' : opt.hex}"></i>
                    </div>
                    <div class="font-black text-sm sm:text-base ${textColor} leading-none flex items-center justify-center">
                        ${opt.ruby}
                    </div>
                `;

                btn.onclick = () => handleAnswer(opt, isCorrect, q);
                grid.appendChild(btn);
            });
        }

        function handleAnswer(selectedOption, isCorrect, questionObj) {
            const modal = document.getElementById('feedbackModal');

            if (isCorrect) {

                speakText(questionObj.targetColorName); // Auto-read correct answer audio
                score += 100;
                updateHUD();

                iconContainer.className = "w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl mb-1 animate-bounce";

                `;

                titleEl.className = "text-lg sm:text-xl font-black text-red-600 mb-0.5";
                titleEl.innerText = "差一點點！再加油！💪";

                const wrongExplanation = selectedOption.wrongReason || `你選擇的是【${selectedOption.ruby}】。`;

                bodyEl.innerHTML = `
                    <div class="p-2 bg-red-50 rounded-lg border border-red-200 text-red-800 font-bold flex items-center space-x-1">
                        <span>❌ 你點到了：</span>
                        <span class="font-black">${selectedOption.ruby}</span>
                    </div>
                    <p class="text-slate-700 leading-normal">${wrongExplanation}</p>
                    <div class="p-2 bg-amber-50 rounded-lg border border-amber-200 text-amber-900 font-bold flex items-center space-x-1">
                        <span>💡 提示：寶可夢要找的是【</span>
                        <span class="font-black">${questionObj.targetRuby}</span>
                        <span>】喔！</span>
                    </div>
                `;

                if (lives <= 0) {
                    nextBtn.className = "w-full mt-2 py-2.5 bg-slate-700 hover:bg-slate-800 text-white font-black text-sm rounded-xl shadow border-b-4 border-slate-900 active:translate-y-0.5 transition";
                    nextBtn.innerText = "查看最後成績 ➔";
                } else {
                    nextBtn.className = "w-full mt-2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm rounded-xl shadow border-b-4 border-indigo-900 active:translate-y-0.5 transition";
                    nextBtn.innerText = "知道了，下一題 ➔";
                }
            }
        }

        function nextQuestion() {
            playSound('click');
            document.getElementById('feedbackModal').classList.add('hidden');

            if (lives <= 0) {
                showGameOver(false);
            } else {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function showGameOver(isVictory) {
            if (!isVictory) {
                playSound('gameover');
            } else {
                playSound('correct');
            }

            document.getElementById('questionScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');

            document.getElementById('finalScoreText').innerText = score;

            const endTitle = document.getElementById('endTitle');
            const endSubtitle = document.getElementById('endSubtitle');
            const badgeTag = document.getElementById('badgeTag');

            if (isVictory || score >= 600) {
                endTitle.innerText = "恭喜大通關！🏆";
                endSubtitle.innerText = "太神奇了！你是寶可夢 8 色大師！";
                badgeTag.innerText = "🌟 寶可夢顏色大師 🌟";
                badgeTag.className = "mt-1.5 inline-block bg-emerald-500 text-white text-xs font-black px-3 py-0.5 rounded-full shadow";
            } else if (score >= 300) {
                endTitle.innerText = "表現得很棒！👍";
                endSubtitle.innerText = "你已經能認出好多種顏色囉！";
                badgeTag.innerText = "🔍 厲害的顏色小偵探";
                badgeTag.className = "mt-1.5 inline-block bg-amber-500 text-white text-xs font-black px-3 py-0.5 rounded-full shadow";
            } else {
                endTitle.innerText = "繼續加油喔！💪";
                endSubtitle.innerText = "多玩幾次，你會認識更多顏色！";
                badgeTag.innerText = "🌱 顏色學習小新星";
                badgeTag.className = "mt-1.5 inline-block bg-blue-500 text-white text-xs font-black px-3 py-0.5 rounded-full shadow";
            }
        }
    </script>
</body>
</html>
